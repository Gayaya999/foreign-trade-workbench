  /* Reference direction: quiet gray canvas, white surfaces, black controls. */
:root{--bg:#f5f6f8;--surface:#fff;--subtle:#f2f3f5;--ink:#171819;--muted:#70747b;--line:#e7e8eb;--blue:#111214;--blue-ink:#303236;--blue-bg:#f0f1f3;--green:#41474c;--green-bg:#eef0f1;--amber:#666970;--amber-bg:#f0f1f3;--radius:24px;--sidebar:0px;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
body.conversational{height:100dvh;overflow:hidden;padding:28px;background:#eceef3}
body.conversational .app{position:relative;isolation:isolate;display:flex;flex-direction:column;width:100%;max-width:1680px;height:100%;min-height:0;margin:0 auto;overflow:hidden;border-radius:30px;background:#f6f7f9}
.app::before{content:none}
.topbar{height:78px;min-height:78px;position:relative;top:auto;z-index:2;background:transparent;border:0;padding:0 28px;gap:20px}
.workspace-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-icon{width:42px;height:42px;padding:0;border-radius:50%;background:#fff;color:#111}
.brand-icon svg{width:23px;height:23px;stroke-width:2}
.brand-name{font-size:14px;letter-spacing:-.02em;font-weight:600}
.space-pill{display:flex;align-items:center;gap:18px;border:0;border-radius:50px;padding:10px 16px;min-height:40px;background:#ffffffc9;color:#27292c;font-size:12px}
.space-pill:hover{background:#fff}
.space-pill>span{font-size:16px;line-height:1}
.top-actions{gap:10px}
.save-indicator{margin-right:8px;font-size:11px;color:#62666e}
.save-indicator .dot{background:#7f858c}
.top-tool.btn{border:0;width:40px;min-width:40px;height:40px;padding:10px;border-radius:50%;background:#ffffffd9;color:#42454a}
.top-tool.btn:hover{background:#fff}
.top-tool svg{width:18px;height:18px}
.avatar{display:grid;width:40px;height:40px;border-radius:50%;background:#fff;color:#45484d}
.avatar svg{width:18px;height:18px}
.nav.workspace-nav{display:flex;flex-shrink:0;align-items:center;justify-content:flex-start;height:82px;min-height:82px;gap:28px;padding:6px clamp(28px,4.8vw,76px) 8px;overflow-x:auto;scrollbar-width:none}
.nav.workspace-nav button{display:block;flex:0 0 auto;min-height:48px;width:auto;padding:0;border:0;border-radius:0;background:transparent;color:#92969d;font-size:30px;line-height:1.4;font-weight:560;letter-spacing:-.045em;white-space:nowrap;transition:color 160ms ease}
.nav.workspace-nav button>span{display:block}
.nav.workspace-nav button svg{display:none}
.nav.workspace-nav button:hover{background:transparent;color:#51555c}
.nav.workspace-nav button.active{color:#121315;background:transparent}
body.conversational .main{display:flex;flex:1;min-height:0;height:auto;min-width:0;margin:0;overflow:hidden}
body.conversational .content{width:100%;height:100%;max-width:none;margin:0;padding:0 clamp(28px,4.8vw,76px) 28px}
.workspace-view{display:flex;flex-direction:column;height:100%;min-height:0}
.workspace-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:52px;margin-bottom:20px;border-bottom:1px solid #e8eaee}
.workspace-tabs{display:flex;align-self:stretch;align-items:stretch;gap:26px;flex-shrink:0;font-size:12px}
.workspace-tabs>span,.workspace-tabs>button{display:flex;align-items:center;padding:0 0 8px;border:0;background:transparent;color:#6e727a;white-space:nowrap}
.workspace-tabs>span.current-tab{position:relative;font-weight:600;color:#171819}
.current-tab::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:#18191c;border-radius:2px}
.workspace-tabs>button:hover{color:#111}
.conversation-tools{gap:10px;padding-bottom:8px}
.conversation-tools .btn{min-height:32px;padding:6px 10px;font-size:11px;border-radius:50px}
.conversation-tools .btn span{display:inline}
.conversation-tools .new-draft-button{background:#fff;border:0;padding-left:13px;padding-right:13px}
.mobile-context-button{display:none!important}
.chat-shell{flex:1;min-height:0;height:auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;min-width:0}
.chat-shell.context-collapsed{grid-template-columns:minmax(0,1fr)}
.chat-shell.context-collapsed>.context-wrap{display:none}
.conversation{position:relative;min-height:0;height:auto;border:0;border-radius:28px;overflow:hidden;background:#fff}
.conversation-scroll{padding:32px 32px 20px;scrollbar-width:thin;scrollbar-color:#e0e2e6 transparent;scrollbar-gutter:stable}
.conversation-scroll:focus-visible{outline:2px solid #c3c8d0;outline-offset:-4px;border-radius:24px}
.conversation-scroll-inner{max-width:720px}
.conversation-welcome{padding:clamp(12px,4vh,45px) 6px 20px;margin:0 auto;max-width:600px}
.welcome-symbol{width:42px;height:42px;display:grid;place-items:center;color:#24262a;background:#f4f5f7;border-radius:14px;margin-bottom:26px}
.welcome-symbol svg{width:22px;height:22px}
.conversation-welcome h2{font-size:29px;font-weight:550;letter-spacing:-.035em;line-height:1.5;margin-bottom:14px}
.conversation-welcome>p{max-width:42ch;font-size:13px;line-height:1.9;color:#777b82}
.starter-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;max-width:none}
.starter{display:flex;flex:0 1 auto;gap:9px;padding:12px 15px;min-height:46px;border:0;border-radius:14px;background:#f4f5f7;font-size:12px;color:#44484e;transition:background 160ms ease}
.starter:hover{background:#eaecf0;color:#111}
.starter>span{font-size:12px}
.starter svg{width:16px;height:16px;color:#6f747b}
.starter>svg:last-child{display:none}
.conversation-bottom{padding:14px 24px 20px;border:0;background:#fff}
.composer{max-width:720px;padding:17px 17px 12px;border:1px solid transparent;border-radius:22px;background:#f5f6f8;transition:border-color 160ms ease}
.composer:focus-within{border-color:#c6cbd3;outline:0;background:#f5f6f8}
.composer textarea{background:transparent;min-height:62px;font-size:13px;color:#24262a}
.composer textarea::placeholder{color:#868a92}
.composer-footer{margin-top:6px}
.composer-left .btn{font-size:11px;color:#6d727a;padding:5px 3px;min-height:32px}
.composer-left .btn:hover{background:transparent;color:#111}
.send-button{width:36px;height:36px;border-radius:50%;background:#101113;color:#fff}
.send-button:hover:not(:disabled){background:#33363b}
.send-button:disabled{background:#e0e3e8;color:#8d939c;opacity:1}
.composer-hint{max-width:720px;margin-top:10px;padding:0 3px;font-size:10px;color:#838791;gap:16px}
.conversation-context-label,.conversation-attachment{max-width:720px;color:#7b7f87;font-size:11px;margin-bottom:10px}
.message{gap:11px;margin-bottom:28px}
.message-icon{background:#f3f4f6;color:#25282c;border-radius:50%;width:28px;height:28px}
.message-name{font-size:10px;color:#858a92;letter-spacing:.02em}
.message-text{font-size:14px;line-height:1.95}
.message.user .message-content{padding:12px 18px;background:#f0f2f5;border-radius:20px 20px 5px 20px;max-width:86%}
.message.user .message-text{font-size:13px}
.message-updates{gap:10px}
.message-update{border:0;padding:0;background:transparent;color:#747a82;font-size:10px}
.message-update svg{color:#4c535c}
.question-options{gap:8px}
.question-options button{border:0;border-radius:50px;background:#f3f4f6;color:#51565e;padding:8px 13px}
.question-options button:hover{background:#e9ebef;color:#111}
.question-options .skip{background:transparent;color:#848891;text-decoration:none}
.context-wrap{min-height:0;min-width:0;display:flex}
.context-panel{width:100%;border:0;background:transparent;min-height:0}
.context-header{padding:5px 4px 17px;border:0}
.context-header h2{font-size:13px;font-weight:550;color:#4a4e55}
.context-eyebrow{font-size:10px;color:#878c94;font-weight:400}
.context-company{font-size:17px;line-height:1.65;font-weight:550;margin-top:16px;color:#24272c}
.context-status-line{gap:9px;margin-top:8px}
.badge{padding:2px 7px;border-radius:50px;background:#eff0f3;color:#777d85;font-weight:400}
.badge.blue,.badge.green,.badge.amber{background:#eceef1;color:#626871}
.context-status-line>.badge{padding:0;background:transparent;font-size:11px;color:#737a83}
.context-scroll{padding:0 2px 0 0;scrollbar-width:thin;scrollbar-color:#e0e2e6 transparent}
.context-group{margin:0 0 10px;padding:18px;border:0;border-radius:22px;background:#fff}
.context-group summary{font-size:12px;font-weight:550;min-height:22px;gap:8px}

  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="dialog-actions"><button class="btn" id="dialog-cancel" type="button">取消</button><button class="btn primary" id="dialog-confirm" type="button">确认</button></div></dialog>
  <script>
  'use strict';
  const ICONS={building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h2m4 0h2M8 11h2m4 0h2"/>',profile:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8m-8 4h5"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/>',content:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8m-8 4h8m-8 4h5"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',back:'<path d="M19 12H5m5-5-5 5 5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="m16 3 5 5-12 12-6 1 1-6zM14 5l5 5"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/>',box:'<path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9M7.5 5.5l9 5"/>',link:'<path d="m10 13 4-4m-6 7-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 12a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-1 1"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8m-8 4h6"/>',save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2z"/><path d="M7 3v6h10V3M7 21v-8h10v8"/>'};
  const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.file}</svg>`;
  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const clone=value=>JSON.parse(JSON.stringify(value));
  const uid=()=>window.crypto?.randomUUID?.()||`local-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const STORAGE_KEY='foreigntrade.company-profile.v1';
  const GROUPS={overview:['name','role','category','website'],products:['products','supply','strengths','files'],customers:['countries','buyerTypes','exclude'],content:['audience','language','platforms','tone','brandNotes','brandReference']};
  const STEP_NAMES=['企业概况','产品与能力','市场与品牌','确认档案'];
  const blankProfile=()=>({name:'',role:'',category:'',website:'',products:[],supply:[],strengths:'',files:[],countries:[],buyerTypes:[],exclude:'',audience:'',language:'英语',platforms:[],tone:'',brandNotes:'',brandReference:'',isDemo:false,confirmed:{}});
  const initialState=()=>({schema:1,draft:blankProfile(),profile:null,version:0,savedAt:null,updatedAt:null,step:0,work:{leads:null,social:null},tasks:{leads:[],social:[]},chat:normalizeChatState()});
  let storageError=false,fileDB=null,autosaveTimer=null,activeView='profile',profileView='wizard',step=0;
  let state=initialState();
  function normalizeProfile(raw){const clean=blankProfile();if(!raw||typeof raw!=='object')return clean;for(const key of Object.keys(clean)){if(key==='confirmed'){if(raw.confirmed&&typeof raw.confirmed==='object')for(const group of Object.keys(GROUPS))if(typeof raw.confirmed[group]==='string')clean.confirmed[group]=raw.confirmed[group];}else if(key==='files'){clean.files=Array.isArray(raw.files)?raw.files.filter(f=>f&&typeof f.id==='string'&&typeof f.name==='string').slice(0,12).map(f=>({id:f.id,name:f.name,size:Number(f.size)||0,type:typeof f.type==='string'?f.type:'',addedAt:typeof f.addedAt==='string'?f.addedAt:''})):[];}else if(Array.isArray(clean[key])){clean[key]=Array.isArray(raw[key])?raw[key].filter(v=>typeof v==='string').map(v=>v.slice(0,250)).slice(0,30):[];}else if(typeof clean[key]==='boolean'){clean[key]=raw[key]===true;}else if(typeof raw[key]==='string'){clean[key]=raw[key].slice(0,15000);}}return clean;}
  function normalizeState(raw){if(!raw||raw.schema!==1||!raw.draft)throw Error('不是本工作台的档案文件');const next=initialState();next.draft=normalizeProfile(raw.draft);next.profile=raw.profile?normalizeProfile(raw.profile):null;next.version=Number.isInteger(raw.version)?Math.max(0,raw.version):0;next.savedAt=typeof raw.savedAt==='string'?raw.savedAt:null;next.updatedAt=typeof raw.updatedAt==='string'?raw.updatedAt:null;next.step=Number.isInteger(raw.step)?Math.max(0,Math.min(3,raw.step)):0;for(const kind of ['leads','social']){next.tasks[kind]=Array.isArray(raw.tasks?.[kind])?raw.tasks[kind].filter(t=>t&&typeof t.id==='string'&&t.fields&&typeof t.fields==='object').slice(0,100).map(t=>({id:t.id,fields:cleanFields(t.fields),profile:normalizeProfile(t.profile),profileVersion:Number(t.profileVersion)||0,createdAt:typeof t.createdAt==='string'?t.createdAt:'',updatedAt:typeof t.updatedAt==='string'?t.updatedAt:''})):[];const w=raw.work?.[kind];if(w&&w.fields)next.work[kind]={editingId:typeof w.editingId==='string'?w.editingId:null,fields:cleanFields(w.fields),profile:normalizeProfile(w.profile),profileVersion:Number(w.profileVersion)||0};}next.chat=normalizeChatState(raw.chat);return next;}
  function cleanFields(raw){const clean={};for(const key of ['title','market','buyers','products','exclude','audience','language','platforms','tone','direction','mode'])if(typeof raw?.[key]==='string')clean[key]=raw[key].slice(0,10000);return clean;}
  try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)state=normalizeState(JSON.parse(saved));}catch(error){storageError=true;}
  step=state.step;profileView=state.profile?'overview':'wizard';
  const hasData=p=>Boolean(p.name||p.role||p.category||p.website||p.products.length||p.countries.length||p.buyerTypes.length||p.audience||p.platforms.length||p.files.length||p.strengths||p.brandNotes||p.exclude||p.tone||p.supply.length||p.brandReference);
  const signature=(p,g)=>JSON.stringify(GROUPS[g].map(k=>p[k]));
  const confirmed=(p,g)=>p.confirmed[g]===signature(p,g);
  const groupHasData=(p,g)=>GROUPS[g].some(k=>Array.isArray(p[k])?p[k].length:Boolean(p[k]));
  const changed=()=>!state.profile||JSON.stringify(state.draft)!==JSON.stringify(state.profile);
  const humanDate=value=>{if(!value)return '尚未保存';const d=new Date(value);return Number.isNaN(d.getTime())?'时间未知':new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);};
  function indicator(text,error=false){document.getElementById('save-indicator').innerHTML=`${icon(error?'info':'check')}<span>${esc(text)}</span>`;}
  function persist(){clearTimeout(autosaveTimer);try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageError=false;indicator('已保存在本机');return true;}catch(error){storageError=true;indicator('尚未保存，请导出备份',true);return false;}}
  function queueSave(){state.updatedAt=new Date().toISOString();indicator('正在保存…');clearTimeout(autosaveTimer);autosaveTimer=setTimeout(persist,450);}
  function toast(message,error=false){const node=document.createElement('div');node.className='toast'+(error?' error':'');node.textContent=message;document.getElementById('toasts').append(node);setTimeout(()=>node.remove(),4200);}
  function ask(title,message,action='确认'){return new Promise(resolve=>{const d=document.getElementById('confirm-dialog');document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-message').textContent=message;document.getElementById('dialog-confirm').textContent=action;const finish=value=>{d.close();d.oncancel=null;resolve(value);};document.getElementById('dialog-cancel').onclick=()=>finish(false);document.getElementById('dialog-confirm').onclick=()=>finish(true);d.oncancel=e=>{e.preventDefault();finish(false);};d.showModal();});}
  function button(text,action,kind='',extra=''){return `<button type="button" class="btn ${kind}" data-action="${action}" ${extra}>${text}</button>`;}
  function inputField(key,label,placeholder='',hint='',type='text',scope='profile'){const value=scope==='profile'?state.draft[key]:(state.work[activeView]?.fields[key]||'');return `<div class="field"><label for="${scope}-${key}">${label}</label><input id="${scope}-${key}" class="input" type="${type}" ${scope==='profile'?`data-field="${key}"`:`data-work-field="${key}"`} value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" ${key==='website'?'inputmode="url"':''}>${hint?`<p class="field-description">${hint}</p>`:''}<p class="field-error" id="error-${key}" role="alert"></p></div>`;}
  function textField(key,label,placeholder='',hint='',scope='profile'){const value=scope==='profile'?state.draft[key]:(state.work[activeView]?.fields[key]||'');return `<div class="field"><label for="${scope}-${key}">${label}</label><textarea id="${scope}-${key}" ${scope==='profile'?`data-field="${key}"`:`data-work-field="${key}"`} placeholder="${esc(placeholder)}">${esc(value)}</textarea>${hint?`<p class="field-description">${hint}</p>`:''}</div>`;}
  function choiceField(key,label,options,multiple=false){return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="field-label">${label}</legend><div class="choices">${options.map(option=>`<label class="choice"><input type="${multiple?'checkbox':'radio'}" name="${key}" data-choice="${key}" value="${esc(option)}" ${(multiple?state.draft[key].includes(option):state.draft[key]===option)?'checked':''}><span>${esc(option)}</span></label>`).join('')}</div></fieldset>`;}
  function tags(key,label,placeholder,hint='按 Enter 或点击添加，可填写多项'){return `<div class="field"><label for="chip-${key}">${label}</label><div class="tag-input">${state.draft[key].map((v,i)=>`<span class="tag">${esc(v)}<button type="button" data-action="remove-tag" data-key="${key}" data-index="${i}" aria-label="移除${esc(v)}">${icon('close')}</button></span>`).join('')}<input id="chip-${key}" data-chip="${key}" placeholder="${esc(placeholder)}" autocomplete="off"><button class="tag-add" type="button" data-action="add-tag" data-key="${key}">添加</button></div><p class="field-description">${hint}</p></div>`;}
  function filesHTML(){return `<div class="field"><label for="product-files">有哪些资料可以证明？</label><label class="upload-zone" for="product-files" id="drop-zone">${icon('upload')}<div><strong>选择文件，或拖到这里</strong><span>产品目录、规格资料、真实图片 · 每个文件不超过 20 MB</span></div><input type="file" id="product-files" accept=".pdf,.docx,.xlsx,.csv,.jpg,.jpeg,.png,.webp,.txt,.md" multiple class="sr-only"></label><p class="field-description">附件保存在当前浏览器中。上传不会自动解析内容或确认产品事实。</p><div class="file-list">${state.draft.files.map(f=>`<div class="file-row">${icon('file')}<div class="file-info"><span class="file-name">${esc(f.name)}</span><span class="file-meta">${fileSize(f.size)} · 本地附件</span></div><button type="button" class="btn icon small" data-action="download-file" data-id="${esc(f.id)}" title="下载附件" aria-label="下载${esc(f.name)}">${icon('download')}</button><button type="button" class="btn icon small" data-action="remove-file" data-id="${esc(f.id)}" title="移除此档案引用" aria-label="移除${esc(f.name)}">${icon('close')}</button></div>`).join('')}</div></div>`;}
  function storageNotice(){return storageError?`<div class="notice amber storage-error">${icon('info')}<div>当前浏览器尚未成功保存档案。请使用“导出档案”备份后再关闭页面。</div></div>`:'';}
  function render(){const names={profile:'企业档案',leads:'客户开发',social:'社媒内容'};document.title=`${names[activeView]} · 外贸工作台`;document.getElementById('breadcrumb').textContent=names[activeView];document.getElementById('module-description').textContent=WORKSPACE_MODULES.find(module=>module.id===activeView).description;document.getElementById('main-nav').innerHTML=WORKSPACE_MODULES.map(({id,symbol,label})=>`<button type="button" class="${activeView===id?'active':''}" data-action="navigate" data-view="${id}" ${activeView===id?'aria-current="page"':''} title="${label}" aria-label="${label}">${icon(symbol)}<span>${label}</span></button>`).join('');const root=document.getElementById('app-content');root.innerHTML=storageNotice()+(activeView==='profile'?(profileView==='wizard'?wizardHTML():overviewHTML()):workspaceHTML(activeView));bindDropZone();if(activeView==='profile'&&profileView==='wizard')updatePreview();}
  function goView(view){flushChips();persist();activeView=view;if(view==='profile')profileView=state.profile||hasData(state.draft)?'overview':'wizard';else ensureWorkspace(view);render();window.scrollTo({top:0,behavior:'instant'});}
  function stepperHTML(){return `<ol class="stepper" aria-label="企业建档步骤">${STEP_NAMES.map((name,i)=>`<li class="${step===i?'active':i<step?'done':''}"><button type="button" class="step-button" data-action="step" data-step="${i}" ${step===i?'aria-current="step"':''}><span class="step-number">${i<step?icon('check'):i+1}</span><span>${name}</span></button></li>`).join('')}</ol>`;}
  function wizardHTML(){return `<div class="page-heading"><div><div class="intro-line"><span class="badge blue">引导建档</span>${state.draft.isDemo?'<span class="badge amber">演示资料</span>':''}</div><h1>${state.profile?'完善企业档案':'先让工作台了解你的业务'}</h1><p>回答几个问题，为客户开发和社媒内容建立一份共用档案。</p></div><div class="heading-actions">${button('填入示例','demo','ghost')}${button(`${icon('upload')}导入档案`,'import','')}</div></div>${stepperHTML()}${step===3?overviewBody(true):`<div class="wizard-layout"><section class="panel form-panel" aria-label="${STEP_NAMES[step]}问答">${step===0?stepOne():step===1?stepTwo():stepThree()}</section>${helpHTML()}</div><div class="wizard-footer"><span class="footer-note">不确定的信息可以留空，之后再补充。</span>${button('保存并退出','save-exit','ghost')}<div class="footer-actions">${step>0?button(`${icon('back')}上一步`,'previous'):''}${button(`${step===2?'预览企业档案':'下一步'}${icon('arrow')}`,'next','primary')}</div></div>`}<p class="footer-caption">${icon('shield')}资料仅在当前浏览器中保存；不会上传到服务器。</p>`;}
  function stepOne(){return `<div class="section-title"><h2>先介绍一下你的企业</h2><p>可以是工厂、贸易公司，也可以是你自己的外贸业务。</p></div><div class="fields">${inputField('name','你的企业或业务叫什么？','例如：某某清洁用品公司','保存正式档案时需要名称，草稿可以稍后补充。')}${choiceField('role','你主要以什么身份经营？',['生产工厂','贸易公司','SOHO','工贸一体'])}${inputField('category','你主要销售什么？','例如：商用清洁用品','先填写主要品类，下一步再添加具体产品。')}${inputField('website','企业官网 <span class="muted">（可选）</span>','例如：example.com','没有官网也可以继续。')}</div>`;}
  function stepTwo(){return `<div class="section-title"><h2>你能提供哪些产品和服务？</h2><p>先记录真实能力，有依据的信息才适合用于对外表达。</p></div><div class="fields">${tags('products','主营产品','输入产品名称')}${choiceField('supply','你的供货方式是什么？',['现货','OEM','ODM'],true)}${textField('strengths','希望向买家强调什么？','填写可核实的产品特点或服务能力','可以记录包装、规格、应用场景或服务条件。不确定的能力暂时留空。')}${filesHTML()}</div>`;}
  function stepThree(){return `<div class="section-title"><h2>你希望面向谁，如何介绍自己？</h2><p>两组偏好分别服务两个工作区，每次任务都可以单独调整。</p></div><section class="preference-section"><div class="preference-heading">${icon('users')}<div><h3>客户开发偏好</h3><p>帮助确定要寻找和核验的企业。</p></div></div><div class="fields">${tags('countries','关注哪些国家或地区？','例如：澳大利亚')}${tags('buyerTypes','希望接触哪类客户？','例如：经销商、批发商')}${textField('exclude','暂时排除哪些客户？','例如：零售门店、清洁服务商')}</div></section><section class="preference-section"><div class="preference-heading">${icon('content')}<div><h3>社媒内容偏好</h3><p>帮助确定内容受众、语言和表达方式。</p></div></div><div class="fields"><div class="two-col">${inputField('audience','内容主要面向谁？','例如：经销商采购人员')}${inputField('language','使用什么语言？','例如：英语')}</div>${tags('platforms','准备在哪些平台使用？','例如：LinkedIn')}${choiceField('tone','希望是什么表达风格？',['专业清楚','简洁直接','稍后选择'])}${textField('brandNotes','品牌介绍或表达要求 <span class="muted">（可选）</span>','例如：介绍专业知识，避免夸张的功效承诺')}${inputField('brandReference','参考内容链接 <span class="muted">（可选）</span>','粘贴一条品牌或内容参考链接')}</div></section>`;}
  function helpHTML(){if(step===0)return `<aside class="panel help-panel"><div class="help-icon">${icon('building')}</div><h3>填写一次，两边共用</h3><p>企业档案是两个独立工作区的基础。客户开发使用业务画像，社媒内容使用产品事实与品牌信息。</p><div class="rule"></div><div class="help-step"><span>${icon('users')}</span><span>客户开发<br><span class="muted">找公司、核验、整理名单</span></span></div><div class="help-step"><span>${icon('content')}</span><span>社媒内容<br><span class="muted">做选题、生成、审查内容</span></span></div><div class="rule"></div><p>你可以随时保存草稿，不需要一次填完。</p></aside>`;if(step===1)return `<aside class="panel help-panel"><div class="help-icon">${icon('box')}</div><h3>档案事实预览</h3><div class="preview-row"><strong>主营品类</strong><p data-preview="products"></p></div><div class="preview-row"><strong>供货方式</strong><p data-preview="supply"></p></div><div class="preview-row"><strong>相关资料</strong><p data-preview="files"></p></div><div class="rule"></div><p>已填写不等于已确认。最后一步可以核对本节信息。</p><ul class="micro-list"><li>附件不会自动变成已确认事实。</li><li>资料不足时，可以先做类目研究。</li></ul></aside>`;return `<aside class="panel help-panel"><div class="help-icon">${icon('globe')}</div><h3>偏好互相独立</h3><p>你可以先做客户研究，也可以直接制作内容，不需要完成另一条业务线。</p><div class="rule"></div><h3>每次任务都可调整</h3><p>企业档案提供默认值，任务内的市场、受众或平台修改只属于该次任务。</p><div class="rule"></div><p>不确定的目标市场或客户类型，可以先留空，后续根据试跑反馈完善。</p></aside>`;}
  function updatePreview(){for(const key of ['products','supply','files']){const el=document.querySelector(`[data-preview="${key}"]`);if(el)el.textContent=key==='files'?(state.draft.files.length?`${state.draft.files.length} 个本地附件`:'尚未上传'):state.draft[key].join('、')||'待补充';}}
  const row=(label,value)=>`<div class="definition-row"><dt>${label}</dt><dd>${value?esc(value):'<span class="muted">待补充</span>'}</dd></div>`;
  function sectionHTML(group,title,symbol,fields,editStep,review=false){const p=state.draft;return `<section class="panel profile-section"><header><div class="section-heading">${icon(symbol)}<h3>${title}</h3></div>${review?`<span class="badge ${confirmed(p,group)?'green':groupHasData(p,group)?'amber':''}">${confirmed(p,group)?'已核对':groupHasData(p,group)?'待确认':'待补充'}</span>`:button('编辑','edit-section','ghost small',`data-step="${editStep}"`)}</header><dl>${fields}</dl><label class="confirm-label"><input type="checkbox" data-confirm="${group}" ${confirmed(p,group)?'checked':''} ${groupHasData(p,group)?'':'disabled'}><span>我已核对本节已填写的信息</span></label></section>`;}
  function overviewHTML(){const p=state.draft;return `<div class="page-heading"><div><div class="intro-line"><span class="badge ${state.profile?'blue':''}">${state.profile?`已保存 v${state.version}`:'档案草稿'}</span>${p.isDemo?'<span class="badge amber">演示档案</span>':''}</div><div class="profile-title"><span class="company-monogram">${esc((p.name||'企').slice(0,1))}</span><h1>${esc(p.name||'你的企业档案')}</h1></div><div class="overview-meta"><span>上次保存：${humanDate(state.savedAt||state.updatedAt)}</span><span>供客户开发与社媒内容共用</span></div></div><div class="heading-actions">${button(`${icon('edit')}编辑档案`,'edit','')}${button(`${icon('plus')}补充资料`,'edit-section','',`data-step="1"`)}</div></div>${overviewBody(false)}`;}
  function overviewBody(inWizard){const p=state.draft;const groups=Object.keys(GROUPS),reviewed=groups.filter(g=>confirmed(p,g)).length;const dirty=changed();let notice='';if(dirty&&state.profile)notice=`<div class="notice amber">${icon('info')}<div>你有尚未保存为正式版本的修改。工作区仍使用 v${state.version}，保存后可在新任务中使用。</div></div>`;else if(!state.profile)notice=`<div class="notice">${icon('info')}<div>先核对已填写的信息，再保存档案。暂时缺失的资料可保留为空，之后补充。</div></div>`;if(inWizard)notice=`<div class="section-title"><h2>核对后，建立你的共用档案</h2><p>已核对 ${reviewed} / 4 节。保留“待确认”不会阻止保存，两个工作区会一同看到这些状态。</p></div>`+notice;return `${notice}<div class="profile-grid">${sectionHTML('overview','企业概况','building',row('企业 / 业务名称',p.name)+row('经营身份',p.role)+row('主营业务',p.category)+row('企业官网',p.website),0,inWizard)}${sectionHTML('products','产品与供货能力','box',row('主营产品',p.products.join('、'))+row('供货方式',p.supply.join('、'))+row('产品特点 / 能力',p.strengths)+row('相关资料',p.files.length?p.files.map(f=>f.name).join('、'):''),1,inWizard)}${sectionHTML('customers','客户开发偏好','users',row('关注国家 / 地区',p.countries.join('、'))+row('目标客户类型',p.buyerTypes.join('、'))+row('排除客户类型',p.exclude),2,inWizard)}${sectionHTML('content','社媒内容偏好','content',row('主要面向',p.audience)+row('使用语言',p.language)+row('使用平台',p.platforms.join('、'))+row('表达风格',p.tone)+row('品牌要求',p.brandNotes)+row('参考链接',p.brandReference),2,inWizard)}</div><div class="profile-savebar"><div><p>${reviewed} 节已核对，${4-reviewed} 节待确认或补充。修改对应信息后，需要重新核对。</p>${state.profile&&dirty?'<button type="button" class="link-button" data-action="restore">恢复已保存版本</button>':''}</div><div class="footer-actions">${inWizard?button('上一步','previous'):button('导入档案','import','ghost')}${button(`${icon('save')}${dirty?'保存档案':'档案已保存'}`,'save-profile','primary',dirty?'':'disabled')}</div></div>${!inWizard?workspaceLinks():''}`;}
  function workspaceLinks(){return `<section class="workspace-links"><header><h2>两个工作区，共用这一份档案</h2><p>分别开展客户开发和社媒内容，进度互不依赖。</p></header><div class="workspace-pair"><button type="button" class="workspace-entry" data-action="navigate" data-view="leads"><span class="entry-icon">${icon('users')}</span><div><strong>进入客户开发</strong><p>基于企业画像，建立客户研究任务。</p></div>${icon('arrow').replace('<svg','<svg class="arrow"')}</button><button type="button" class="workspace-entry" data-action="navigate" data-view="social"><span class="entry-icon">${icon('content')}</span><div><strong>进入社媒内容</strong><p>基于产品与品牌，建立内容制作任务。</p></div>${icon('arrow').replace('<svg','<svg class="arrow"')}</button></div></section><p class="footer-caption">${icon('info')}新任务引用档案副本；修改任务字段不会覆盖企业档案。</p>`;}
  function validWebsite(){const field=document.getElementById('profile-website');if(!state.draft.website.trim())return true;try{const url=new URL(/^https?:\/\//i.test(state.draft.website)?state.draft.website:`https://${state.draft.website}`);if(!['https:','http:'].includes(url.protocol)||!url.hostname.includes('.')||/\s/.test(url.hostname))throw Error();return true;}catch(error){if(field){field.classList.add('invalid');field.setAttribute('aria-invalid','true');document.getElementById('error-website').textContent='请填写有效的网站地址，例如 example.com，或暂时留空。';field.focus();}return false;}}

  function workspaceHTML(kind){ensureWorkspace(kind);const social=kind==='social';const w=state.work[kind],p=w.profile,count=state.tasks[kind].length;return `<div class="page-heading"><div><div class="intro-line"><span class="badge blue">${social?'内容制作':'客户研究'}</span><span class="badge">任务草稿</span></div><h1>${social?'社媒内容工作区':'客户开发工作区'}</h1><p>${social?'从产品与品牌信息开始，独立建立选题和图文任务。':'从企业画像开始，独立建立候选发现与客户核验任务。'}</p></div><div class="heading-actions">${button(`${icon('plus')}新建草稿`,'new-task','',`data-kind="${kind}"`)}</div></div><div class="snapshot-banner">${icon('building')}<div><strong>${esc(p.name||'尚未命名的企业')}${p.isDemo?' · 演示资料':''}</strong><p>引用${w.profileVersion?`企业档案 v${w.profileVersion}`:'企业档案草稿'} · 本任务的调整不会覆盖档案</p></div>${button('查看企业档案','navigate','ghost small','data-view="profile"')}</div><div class="workspace-layout"><section class="panel form-panel"><div class="section-title"><h2>${w.editingId?'编辑任务草稿':'准备一个新任务'}</h2><p>字段已从档案副本带入，你可以为本次任务单独调整。</p></div><div class="fields">${inputField('title','任务名称',social?'例如：清洁用品采购指南':'例如：澳大利亚经销商研究','','text','work')}${social?`<div class="two-col">${inputField('audience','目标读者','面向谁制作内容？','','text','work')}${inputField('language','内容语言','例如：英语','','text','work')}</div><div class="two-col">${inputField('platforms','使用平台','例如：LinkedIn','','text','work')}${inputField('tone','表达风格','例如：专业清楚','','text','work')}</div>${textField('direction','本次内容方向','想回答什么采购问题，或者介绍什么产品？','','work')}<div class="field"><label for="work-mode">内容模式</label><select id="work-mode" data-work-field="mode"><option ${w.fields.mode==='类目研究'?'selected':''}>类目研究</option><option ${w.fields.mode==='产品宣传'?'selected':''}>产品宣传</option></select><p class="field-description">产品宣传中的具体能力与参数，需要引用已确认的产品事实。</p></div>`:`<div class="two-col">${inputField('market','目标国家 / 地区','本次研究的市场','','text','work')}${inputField('buyers','目标买家类型','例如：经销商、批发商','','text','work')}</div>${inputField('products','本次产品范围','例如：商用清洁用品','','text','work')}${textField('exclude','排除条件','哪些企业暂时不纳入名单？','','work')}`}</div><div class="workspace-submit"><span class="footer-note">只保存草稿，尚未执行研究或生成内容。</span>${button(`${icon('save')}保存任务草稿`,'save-task','primary',`data-kind="${kind}"`)}</div></section><aside class="panel help-panel"><div class="help-icon">${icon(social?'content':'users')}</div><h3>${social?'本次任务会准备什么':'本次任务会研究什么'}</h3><p>${social?'最多 3 个有依据的选题，选择 1 个制作英文正文、中文对照和三页图文。':'先发现最多 10 家候选企业，再重点核验最多 5 家，并记录来源和人工判断。'}</p><div class="rule"></div><h3>档案带入的上下文</h3><div class="preview-row"><strong>主营业务</strong><p>${esc(p.category||'待补充')}</p></div><div class="preview-row"><strong>产品与供货方式</strong><p>${esc([...p.products,...p.supply].join('、')||'待补充')}</p></div><div class="preview-row"><strong>信息核对状态</strong><p>${Object.keys(GROUPS).filter(g=>confirmed(p,g)).length} / 4 节已核对</p></div><div class="rule"></div><p>本页为可交互前端。搜索、AI 创作与任务执行尚未接入；保存后不会自动发信或发布。</p></aside></div><section class="draft-list"><header><h2>已保存的任务草稿</h2><span>${count} 项</span></header>${count?state.tasks[kind].map(t=>`<div class="draft-row">${icon(social?'content':'folder')}<div><strong>${esc(t.fields.title||'未命名任务')}</strong><p>${humanDate(t.updatedAt)} · ${t.profileVersion?`档案 v${t.profileVersion}`:'引用档案草稿'} · 未执行</p></div>${button('打开草稿','open-task','small',`data-id="${esc(t.id)}" data-kind="${kind}"`)}</div>`).join(''):'<p class="empty-note">为任务取个名称并保存，之后可以从这里继续编辑。</p>'}</section>`;}
  function saveTask(kind){const w=state.work[kind];if(!w.fields.title?.trim()){const input=document.getElementById('work-title');input.classList.add('invalid');input.setAttribute('aria-invalid','true');document.getElementById('error-title').textContent='给任务起个名称，方便之后继续。';input.focus();return;}const now=new Date().toISOString();const old=state.tasks[kind].find(t=>t.id===w.editingId);const record={id:w.editingId||uid(),fields:clone(w.fields),profile:clone(w.profile),profileVersion:w.profileVersion,createdAt:old?.createdAt||now,updatedAt:now};state.tasks[kind]=[record,...state.tasks[kind].filter(t=>t.id!==record.id)].slice(0,100);w.editingId=record.id;const ok=persist();render();toast(ok?'任务草稿已保存，企业档案保持原样。':'本机保存失败，请使用导出备份。',!ok);}
  const memoryFiles=new Map();
  function fileSize(n){return n>1024*1024?`${(n/1024/1024).toFixed(1)} MB`:`${Math.max(1,Math.round(n/1024))} KB`;}
  async function db(){if(fileDB)return fileDB;return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('浏览器不支持附件存储'));return;}const req=indexedDB.open('foreigntrade-profile-files',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files');};req.onsuccess=()=>{fileDB=req.result;resolve(fileDB);};req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('附件存储被其他窗口占用'));});}

  async function addFiles(files){flushChips();const list=Array.from(files);let added=0,temporary=false;for(const file of list){if(state.draft.files.length>=12){toast('每份档案最多添加 12 个附件。',true);break;}if(file.size>20*1024*1024){toast(`${file.name} 超过 20 MB，未添加。`,true);continue;}if(!/\.(pdf|docx|xlsx|csv|jpg|jpeg|png|webp|txt|md)$/i.test(file.name)){toast(`${file.name} 的格式暂不支持。`,true);continue;}if(state.draft.files.some(f=>f.name===file.name&&f.size===file.size)){toast(`${file.name} 已添加。`);continue;}const id=uid();try{await storeFile(id,file);}catch(error){temporary=true;}state.draft.files.push({id,name:file.name,size:file.size,type:file.type,addedAt:new Date().toISOString()});added++;}if(added){state.updatedAt=new Date().toISOString();persist();render();toast(temporary?'附件暂存在当前页面，请下载备份；关闭后可能需要重新上传。':`已保存 ${added} 个附件，尚未解析或确认其中内容。`,temporary);}}

  document.addEventListener('toggle',event=>{if(event.target.dataset.contextGroup)chatUI.groupOpen[event.target.dataset.contextGroup]=event.target.open;},true);
  document.addEventListener('input',event=>{if(event.target.dataset.chatInput){state.chat.inputs[activeView]=event.target.value;queueSave();resizeComposer();}});
  document.addEventListener('keydown',event=>{if(event.target.id==='conversation-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229){event.preventDefault();sendChat();}});
  document.addEventListener('click',event=>{const target=event.target.closest('[data-chat-action]');if(!target||target.disabled)return;const action=target.dataset.chatAction;if(action==='send')sendChat();else if(action==='answer')sendChat(target.dataset.answer);else if(action==='profile-editor'){chatUI.stateOpen=false;step=Math.max(0,Math.min(3,Number(target.dataset.step)||0));state.step=step;chatUI.editor='profile';render();}else if(action==='task-editor'){if(activeView==='profile')return;chatUI.stateOpen=false;chatUI.editor='task';render();}else if(action==='close-editor'){flushChips();persist();chatUI.editor=null;render();}else if(action==='toggle-context'){chatUI.contextCollapsed=!chatUI.contextCollapsed;render();}else if(action==='show-state'){chatUI.stateOpen=true;renderEditors();}else if(action==='close-state'){chatUI.stateOpen=false;renderEditors();}else if(action==='prefill-example'){state.chat.inputs[activeView]=activeView==='profile'?'公司叫示例清洁用品公司，我们是做商用清洁用品的工厂，支持 OEM，想开发澳大利亚的经销商。':activeView==='leads'?'这次想寻找澳大利亚的清洁用品经销商，排除清洁服务商。':'想为 LinkedIn 生成一篇采购指南，内容面向经销商采购人员，使用英语。';queueSave();render();document.getElementById('conversation-input').focus();}});

  document.getElementById('brand-symbol').innerHTML=icon('building');document.getElementById('avatar-symbol').innerHTML=icon('user');document.querySelector('[data-action="export"]').innerHTML=icon('download');indicator(state.updatedAt||state.savedAt?'已从本机恢复':'尚未填写');render();
  </script>
</body>
</html>
